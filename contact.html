<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact – Shibboleth</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root {
      --bg: #fafaf8;
      --title: #2b2b2b;
      --sub: #7a7a76;
      /* Width of the painting: always fills the window (it is 3:2) */
      --w: max(100vw, 150vh);
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    /* The painting, edge to edge. On wide windows the extra height is cropped,
       a quarter from the top and three quarters from the bottom, to keep the faces. */
    .stage {
      position: fixed;
      top: calc((100vh - var(--w) / 1.5) * 0.25);
      left: 50%;
      transform: translateX(-50%);
      width: var(--w);
      aspect-ratio: 3 / 2;
    }

    .stage img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }

    /* The text sits in the open space between the two men */
    .text {
      position: absolute;
      left: 50.5%;
      top: 45%;
      width: 25%;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", Times, serif;
      font-weight: 700;
      font-size: calc(var(--w) * 0.032);
      letter-spacing: -0.01em;
      line-height: 1.08;
      color: var(--title);
    }

    p {
      margin: 0.7em 0 0;
      font-family: Georgia, "Times New Roman", Times, serif;
      font-size: max(15px, calc(var(--w) * 0.0118));
      line-height: 1.5;
      color: var(--sub);
    }

    .home {
      display: inline-block;
      margin-top: 1.6rem;
      padding: 0.65em 1.3em;
      font-family: Georgia, "Times New Roman", Times, serif;
      font-size: 1rem;
      line-height: 1;
      color: var(--title);
      text-decoration: none;
      border: 1px solid var(--title);
      transition: background-color 0.15s, color 0.15s;
    }

    .home:hover, .home:focus-visible {
      background: var(--title);
      color: var(--bg);
    }

    /* Portrait screens: text on top, painting full width at the bottom */
    @media (max-aspect-ratio: 1/1) {
      .stage {
        top: auto;
        bottom: 0;
        left: 0;
        transform: none;
        width: 100vw;
      }

      .text {
        position: fixed;
        top: clamp(28px, 8vh, 88px);
        left: 24px;
        right: 24px;
        width: auto;
      }

      h1 { font-size: clamp(2rem, 8vw, 3.25rem); }
      p  { font-size: 1.05rem; max-width: 28rem; }
    }

    /* Short landscape screens (phones held sideways): a more compact text block */
    @media (max-height: 520px) and (min-aspect-ratio: 1/1) {
      .text { top: 41%; }
      h1 { font-size: max(20px, calc(var(--w) * 0.027)); }
      p  { font-size: max(12.5px, calc(var(--w) * 0.0118)); line-height: 1.4; }
      .home {
        margin-top: 1rem;
        padding: 0.55em 1.1em;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <img src="/contact-picture.webp" width="1536" height="1024" alt="Painting of two men facing each other. One, seen from behind, holds a tomato and says “tomato.” The other looks back at him and says “tomahto.”">
    <div class="text">
      <h1>Contact</h1>
      <p>We appreciate your interest and have decided against it. For general enquiries, see the previous sentence.</p>
      <a class="home" href="/">Return home</a>
    </div>
  </div>
</body>
</html>
