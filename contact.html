<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact – Shibboleth</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root {
      --bg: #fafaf8;
      --title: #2b2b2b;
      --sub: #7a7a76;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; margin: 0; }

    body {
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 48px 24px;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }

    main { max-width: 32rem; }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", Times, serif;
      font-weight: 700;
      font-size: clamp(2.75rem, 10vw, 5rem);
      letter-spacing: -0.01em;
      line-height: 1.1;
      color: var(--title);
    }

    p {
      margin: 0.8rem 0 0;
      font-family: Georgia, "Times New Roman", Times, serif;
      font-size: clamp(1rem, 3.2vw, 1.15rem);
      line-height: 1.5;
      color: var(--sub);
      text-wrap: balance;
    }

    .home {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.65em 1.3em;
      font-family: Georgia, "Times New Roman", Times, serif;
      font-size: 1rem;
      line-height: 1;
      color: var(--title);
      text-decoration: none;
      border: 1px solid var(--title);
      transition: background-color 0.15s, color 0.15s;
    }

    .home:hover, .home:focus-visible {
      background: var(--title);
      color: var(--bg);
    }

    /* Gentle entrance, as on the home page */
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }

    h1    { animation: rise 1s ease-out both; }
    p     { animation: rise 1s ease-out 0.35s both; }
    .home { animation: rise 1s ease-out 0.7s both; }

    @media (prefers-reduced-motion: reduce) {
      h1, p, .home { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Contact</h1>
    <p>Thank you for your interest. We aren&rsquo;t taking enquiries at the moment, but we&rsquo;re glad you stopped by.</p>
    <a class="home" href="/">Return home</a>
  </main>
</body>
</html>
