<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something went wrong – Shibboleth</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root {
      --bg: #fafaf8;
      --title: #2b2b2b;
      --sub: #7a7a76;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    /* Picture: transparent background, flush with the bottom-left corner */
    .art {
      position: fixed;
      left: 0;
      bottom: 0;
      display: block;
      width: min(82vw, 112vh, 1773px);
      height: auto;
      pointer-events: none;
    }

    /* Text: top right */
    main {
      position: fixed;
      top: clamp(28px, 8vh, 88px);
      right: clamp(24px, 6vw, 88px);
      text-align: left;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", Times, serif;
      font-weight: 700;
      font-size: clamp(2rem, 4.2vw, 3.5rem);
      letter-spacing: -0.01em;
      line-height: 1.08;
      color: var(--title);
    }

    .home {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.65em 1.3em;
      font-family: Georgia, "Times New Roman", Times, serif;
      font-size: 1rem;
      line-height: 1;
      color: var(--title);
      text-decoration: none;
      border: 1px solid var(--title);
      transition: background-color 0.15s, color 0.15s;
    }

    .home:hover, .home:focus-visible {
      background: var(--title);
      color: var(--bg);
    }

    /* Narrow or portrait screens: picture spans the full width */
    @media (max-width: 700px), (max-aspect-ratio: 1/1) {
      .art { width: 112vw; }
    }
  </style>
</head>
<body>
  <img class="art" src="/404-picture.webp" width="1773" height="1228" alt="Painting of a man in uniform holding up three fingers to another man whose face is blank">
  <main>
    <h1>Something<br>went wrong</h1>
    <a class="home" href="/">Return home</a>
  </main>
</body>
</html>
