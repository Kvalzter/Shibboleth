<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something went wrong – Shibboleth</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root {
      --bg: #fafaf8;
      --title: #2b2b2b;
      --sub: #7a7a76;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; margin: 0; }

    body {
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 48px 24px;
      -webkit-font-smoothing: antialiased;
    }

    main { max-width: 40rem; }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", Times, serif;
      font-weight: 700;
      font-size: clamp(2.75rem, 10vw, 5rem);
      letter-spacing: -0.01em;
      line-height: 1.1;
      color: var(--title);
    }

    p {
      margin: 0.6rem 0 0;
      font-family: Georgia, "Times New Roman", Times, serif;
      font-size: clamp(1rem, 3.2vw, 1.15rem);
      line-height: 1.5;
      color: var(--sub);
    }

    img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 0 2rem;
    }

    a {
      color: var(--sub);
      text-decoration: underline;
      text-underline-offset: 0.2em;
      text-decoration-thickness: 1px;
    }

    a:hover, a:focus-visible { color: var(--title); }
  </style>
</head>
<body>
  <main>
    <img src="/404-picture.webp" width="1280" height="720" alt="Painting of a man in uniform holding up three fingers to another man whose face is blank">
    <h1>Something went wrong</h1>
    <p>
      <a href="/">Return home</a>
    </p>
  </main>
</body>
</html>
