<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something went wrong – Shibboleth</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root {
      --bg: #fafaf8;
      --title: #2b2b2b;
      --sub: #7a7a76;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    /* Picture: flush with the bottom-left corner */
    .art {
      position: fixed;
      left: 0;
      bottom: 0;
      display: block;
      width: min(82vw, 128vh, 1773px);
      height: auto;
    }

    /* Text: top right */
    main {
      position: fixed;
      top: clamp(28px, 7vh, 80px);
      right: clamp(24px, 6vw, 88px);
      max-width: min(26rem, calc(100vw - 48px));
      text-align: right;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", Times, serif;
      font-weight: 700;
      font-size: clamp(2.25rem, 6vw, 4.25rem);
      letter-spacing: -0.01em;
      line-height: 1.1;
      color: var(--title);
    }

    p {
      margin: 0.8rem 0 0;
      font-family: Georgia, "Times New Roman", Times, serif;
      font-size: clamp(1rem, 3.2vw, 1.15rem);
      line-height: 1.5;
      color: var(--sub);
    }

    a {
      color: var(--sub);
      text-decoration: underline;
      text-underline-offset: 0.2em;
      text-decoration-thickness: 1px;
    }

    a:hover, a:focus-visible { color: var(--title); }

    /* Narrow or portrait screens: picture spans the full width */
    @media (max-width: 700px), (max-aspect-ratio: 1/1) {
      .art { width: 100vw; }
    }
  </style>
</head>
<body>
  <img class="art" src="/404-picture.webp" width="1773" height="998" alt="Painting of a man in uniform holding up three fingers to another man whose face is blank">
  <main>
    <h1>Something went wrong</h1>
    <p><a href="/">Return home</a></p>
  </main>
</body>
</html>
