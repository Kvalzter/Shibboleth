<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shibboleth</title>
  <meta name="description" content="Shibboleth: from Hebrew shibbólet, ear of grain.">
  <style>
    :root {
      --bg: #fafaf8;
      --title: #2b2b2b;
      --sub: #7a7a76;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 24px;
      -webkit-font-smoothing: antialiased;
    }

    main { max-width: 40rem; }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", Times, serif;
      font-weight: 700;
      font-size: clamp(2.75rem, 10vw, 5rem);
      letter-spacing: -0.01em;
      line-height: 1.1;
      color: var(--title);
    }

    p {
      margin: 0.6rem 0 0;
      font-family: Georgia, "Times New Roman", Times, serif;
      font-size: clamp(1rem, 3.2vw, 1.15rem);
      line-height: 1.5;
      color: var(--sub);
    }

    .ipa { margin-right: 0.35em; }
  </style>
</head>
<body>
  <main>
    <h1>Shibboleth</h1>
    <p>
      <span class="ipa">/ˈʃɪbəlɛθ/</span>
      from Hebrew <span lang="he">שִׁבֹּלֶת</span> (<i>shibbólet</i>), &ldquo;ear of grain&rdquo;
    </p>
  </main>
</body>
</html>
