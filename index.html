<head>
  <meta charset="utf-8">

  <!-- Link preview (chat apps, social media) -->

  <meta property="og:site_name" content="Shibboleth">
  <meta property="og:title" content="Shibboleth">
  <meta property="og:description" content="From Hebrew shibbólet, “ear of grain”.">
  <meta property="og:url" content="https://shibboleth.se/">
  <meta property="og:image" content="https://shibboleth.se/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Painting of a man in uniform holding up three fingers to another man whose face is blank, beside the word Shibboleth">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Shibboleth">
  <meta name="twitter:description" content="From Hebrew shibbólet, “ear of grain”.">
  <meta name="twitter:image" content="https://shibboleth.se/og-image.jpg">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root {
      --bg: #fafaf8;
      --title: #2b2b2b;
      --sub: #7a7a76;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 24px;
      -webkit-font-smoothing: antialiased;
    }

    main { max-width: 40rem; }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", Times, serif;
      font-weight: 700;
      font-size: clamp(2.75rem, 10vw, 5rem);
      letter-spacing: -0.01em;
      line-height: 1.1;
      color: var(--title);
    }

    p {
      margin: 0.6rem 0 0;
      font-family: Georgia, "Times New Roman", Times, serif;
      font-size: clamp(1rem, 3.2vw, 1.15rem);
      line-height: 1.5;
      color: var(--sub);
    }

    .ipa { margin-right: 0.35em; }

    /* Gentle entrance: title first, then the definition */
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }

    h1 { animation: rise 1s ease-out both; }
    p  { animation: rise 1s ease-out 0.35s both; }

    /* Footer links */
    nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: clamp(24px, 5vh, 48px);
      display: flex;
      justify-content: center;
      gap: 2rem;
      animation: rise 1s ease-out 0.7s both;
    }

    nav a {
      font-family: Georgia, "Times New Roman", Times, serif;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
      color: #5f5f5b;
      text-decoration: none;
    }

    nav a:hover, nav a:focus-visible {
      color: var(--title);
      text-decoration: underline;
      text-underline-offset: 0.25em;
      text-decoration-thickness: 1px;
    }

    @media (prefers-reduced-motion: reduce) {
      h1, p, nav { animation: none; }
    }

    /* Easter egg: looks like plain text until hovered or focused */
    .egg {
      color: inherit;
      text-decoration: none;
      cursor: text;
    }

    .egg:hover, .egg:focus-visible {
      text-decoration: underline dotted;
      text-underline-offset: 0.2em;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>Shibboleth</h1>
    <p>
      <span class="ipa">/ˈʃɪbəlɛθ/</span>
      from Hebrew <span lang="he">שִׁבֹּלֶת</span> (<i>shibbólet</i>), &ldquo;<a class="egg" href="/meaning">ear of grain</a>&rdquo;
    </p>
  </main>
  <nav aria-label="Site">
    <a href="/contact">Contact</a>
    <a href="/publications">Publications</a>
  </nav>
</body>
</html>
